services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      ADS_LEADS_HOST: 0.0.0.0
      ADS_LEADS_DATA_DIR: /app/data
    ports:
      # Только localhost: снаружи доступ идёт через nginx (HTTPS + домен).
      - "127.0.0.1:${ADS_LEADS_PUBLISH_PORT:-8021}:8000"
    volumes:
      - ./data:/app/data
    shm_size: "1gb"  # Chromium в контейнере
    restart: unless-stopped
