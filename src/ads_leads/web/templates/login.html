<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · AdBeam Leads</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
           font:15px/1.5 "Montserrat",system-ui,sans-serif; color:#14254e; overflow:hidden;
           background:#14254e; position:relative; }
    /* «луч» как на adbeam.ru */
    body::before { content:""; position:fixed; right:-10vw; top:20vh; width:90vw; height:60vh; pointer-events:none;
           background:conic-gradient(from 258deg at 0% 50%, transparent 0deg, rgba(241,182,43,.0) 4deg,
                      rgba(241,182,43,.55) 9deg, rgba(249,187,25,.25) 14deg, transparent 22deg);
           filter:blur(6px); transform:scaleX(-1); }
    .card { position:relative; width:100%; max-width:400px; background:#fff; border-radius:12px; padding:36px 34px 32px;
            box-shadow:0 30px 80px rgba(0,0,0,.35); }
    .logo { height:46px; display:block; margin-bottom:26px; }
    h1 { font-size:26px; font-weight:800; margin:0 0 6px; letter-spacing:-.02em; }
    p.sub { color:#62708c; margin:0 0 24px; font-size:14px; }
    label { display:block; font-size:13px; color:#62708c; margin:0 0 6px; font-weight:600; }
    input { width:100%; font:inherit; padding:12px 14px; border:1px solid #c7cee4; border-radius:6px; margin-bottom:16px;
            outline:none; color:#14254e; transition:border-color .15s, box-shadow .15s; }
    input:focus { border-color:#14254e; box-shadow:0 0 0 3px rgba(241,182,43,.35); }
    button { width:100%; font:inherit; font-weight:700; padding:13px; border:0; border-radius:6px; cursor:pointer;
             color:#14254e; background:#f1b62b; margin-top:6px; transition:background .15s; }
    button:hover { background:#f9bb19; }
    .error { background:#fdecea; color:#c0392b; border-radius:6px; padding:10px 12px; font-size:14px; margin-bottom:16px; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <img class="logo" src="/static/logo.png" alt="AdBeam">
    <h1>Вход в AdBeam Leads</h1>
    <p class="sub">База рекламодателей и досье по нишам</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="login">Логин</label>
    <input id="login" name="login" value="{{ login or '' }}" autocomplete="username" required {% if not login %}autofocus{% endif %}>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required {% if login %}autofocus{% endif %}>
    <button>Войти</button>
  </form>
</body>
</html>
