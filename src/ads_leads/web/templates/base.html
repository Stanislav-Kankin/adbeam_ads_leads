<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AdBeam Leads{% endblock %}</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="/static/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css?v=4">
</head>
<body>
<header class="topbar">
  <div class="inner">
    <a class="logo" href="/" title="AdBeam Leads"><img src="/static/logo.png" alt="AdBeam"></a>
    <nav>
      <a href="/" class="{{ 'on' if request.url.path == '/' or request.url.path.startswith('/niches') }}">Ниши</a>
      <a href="/companies" class="{{ 'on' if request.url.path.startswith('/companies') }}">Все компании</a>
    </nav>
    <div class="right">
      {% if keyso_ready %}<span class="badge ok">● Keys.so подключён</span>
      {% else %}<span class="badge warn" title="Укажите ADS_LEADS_KEYSO_API_TOKEN в файле .env">Keys.so не подключён</span>{% endif %}
      {% if user %}
      <span class="user">{{ user }}</span>
      <form method="post" action="/logout" style="margin:0"><button class="ghost sm">Выйти</button></form>
      {% endif %}
    </div>
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
